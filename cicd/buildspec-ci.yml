version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Installing application dependencies"
      - python -m pip install --upgrade pip
      - pip install -r app/requirements.txt
      - pip install -r requirements-ci.txt

  pre_build:
    commands:
      - echo "Running static code analysis"
      - flake8 app/app.py app/tests lambda/index.py lambda/tests --max-line-length=100

  build:
    commands:
      - echo "Running application tests with coverage"
      - cd app
      - pytest tests -v --cov=app --cov-report=term-missing --cov-fail-under=80
      - cd ..
      - echo "Running Lambda tests with coverage"
      - cd lambda
      - pytest tests -v --cov=index --cov-report=term-missing --cov-fail-under=80
      - cd ..

  post_build:
    commands:
      - echo "Posting CI result to CodeCommit pull request"
      - >-
        aws codecommit post-comment-for-pull-request
        --pull-request-id "$PULL_REQUEST_ID"
        --repository-name image-recognition
        --content "CI build passed. Build details: $CODEBUILD_PUBLIC_BUILD_URL"
        --before-commit-id "$DESTINATION_COMMIT_ID"
        --after-commit-id "$SOURCE_COMMIT_ID"
        --region "$AWS_REGION"